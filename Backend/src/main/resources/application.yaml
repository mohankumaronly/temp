spring:
  application:
    name: analyzer

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${BREVO_SMTP_HOST}
    port: ${BREVO_SMTP_PORT}
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  email:
    sender: ${BREVO_SENDER_EMAIL:rockrangerz801@gmail.com}
    sender-name: ${BREVO_SENDER_NAME:Resume Analyzer}

  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
    max-age-seconds: ${COOKIE_MAX_AGE:86400}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

# Groq disabled for local development
# groq:
#   api:
#     key: ${GROQ_API_KEY}
#     url: ${GROQ_API_URL}
#     model: ${GROQ_API_MODEL}

ollama:
  api:
    url: ${OLLAMA_API_URL:http://localhost:11434/api/chat}
    model: ${OLLAMA_API_MODEL:llama3.2:3b}